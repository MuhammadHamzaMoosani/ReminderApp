
<div class="flex justify-center p-4 overflow-hidden ">
    <div class="md:w-1/2 w-full bg-gray-800 p-6 rounded-2xl shadow-lg "> 
        <div class="flex justify-center">
            <img src="assets/navbar.png" alt="" class="w-30 h-30 md:w-45 md:h-45 object-contain" />
        </div>
        <form #myForm="ngForm" (ngSubmit)="onSubmit(myForm)" class="space-y-8">
           <div class="space-y-4">
            <label for="" class=" ml-0.5">Email</label>
            <input type="email" placeholder="Email" class="w-full p-3 rounded-xl bg-gray-900 text-white placeholder-gray-500 focus:outline-none">
            <label for="">Password</label>
            <input type="password" placeholder="Password" class="w-full p-3 rounded-xl bg-gray-900 text-white placeholder-gray-500 focus:outline-none">
           </div>
            <button class="w-full bg-green-600 rounded-xl p-3 hover:bg-green-700 font-bold" (click)="login()">Login</button>
        </form>
    </div>
</div>

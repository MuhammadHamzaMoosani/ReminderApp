<div class="flex h-screen">
  <!-- ✅ Side Nav -->
  <aside [class.w-64]="!collapsed" [class.w-16]="collapsed"
    class="bg-gray-900 flex flex-col transition-all duration-300 relative overflow-hidden">

    <!-- Header -->
    <div class="p-4 border-b border-gray-700 flex justify-between items-center">
      <h3 *ngIf="!collapsed" class="text-xl font-bold text-green-400">Workspaces</h3>
      <button (click)="collapsed=!collapsed" class="text-gray-400 hover:text-white">
        <mat-icon>{{ collapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
      </button>
    </div>

    <!-- Workspaces List -->
    <ul class="flex-1 overflow-y-auto p-4 space-y-2">
      <li *ngFor="let ws of workspaces" class="bg-gray-800 p-3 rounded-lg flex justify-between items-center">
        <!-- Inline Rename -->
        <ng-container *ngIf="ws.editing; else viewMode">
          <input [(ngModel)]="ws.name" (blur)="stopEditing(ws)"
          (keydown.enter)="stopEditing(ws)"
          class="bg-gray-700 text-white px-2 py-1 rounded w-full" />
        </ng-container>
        <ng-template #viewMode>
          <span *ngIf="!collapsed">{{ ws.name }}</span>
        </ng-template>

        <!-- 3-dot menu -->
        <div class="relative" (click)="$event.stopPropagation()" *ngIf="!collapsed">
          <button (click)="toggleMenu(ws)" class="p-1 rounded hover:bg-gray-600">
            <mat-icon class="text-gray-400 hover:text-white">more_vert</mat-icon>
          </button>
          <div *ngIf="ws.showMenu"
            class="absolute right-0 mt-2 w-32 bg-gray-700 rounded-lg shadow-md text-sm z-20">
            <button (click)="editWorkspace(ws)" class="block w-full text-left px-4 py-2 hover:bg-gray-600 rounded-lg">Rename</button>
            <button (click)="removeWorkspace(ws)" class="block w-full text-left px-4 py-2 text-red-400 hover:bg-gray-600 rounded-lg">Delete</button>
          </div>
        </div>
      </li>

      <!-- Add Workspace -->
      <li *ngIf="!collapsed">
        <button (click)="addWorkspace()" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-green-600 hover:bg-green-700 w-full">
          <mat-icon>add</mat-icon>
          <span>Add Workspace</span>
        </button>
      </li>
    </ul>
  </aside>

  <!-- ✅ Main Content -->
  <main class="flex-1 p-6 text-white overflow-y-auto">
    <div class="flex items-center justify-between p-2 pb-6">
  <!-- Header -->
  <h2 class="text-2xl font-bold text-green-400">My Tasks</h2>

  <!-- Calendar Button -->
  <button (click)="toggleCalendar()" 
          class="flex items-center gap-1 px-2 py-1 rounded-md bg-blue-600 hover:bg-blue-700 text-xs">
    <mat-icon class="text-sm">calendar_today</mat-icon>
    <span *ngIf="!collapsed">Calendar</span>
  </button>
</div>
<ng-container *ngIf="activeWorkspace">
  <div *ngFor="let task of activeWorkspace.tasks"
       class="bg-gray-800 p-4 mb-3 rounded-lg shadow-md hover:bg-gray-700 transition">
    
    <!-- Task Header Row -->
    <div class="flex justify-between items-center" (click)="toggleSubtasks(task)"> 
      <div>
        <h3 class="font-semibold text-lg">{{ task.title }}</h3>
        <p class="text-gray-400 text-sm">Due Date: {{ task.dueDate }}</p>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- Priority Badge -->
        <span [ngClass]="{
          'text-red-400': task.priority === 'high',
          'text-yellow-400': task.priority === 'medium',
          'text-green-400': task.priority === 'low'
        }" 
        class="uppercase text-sm font-bold">
          {{ task.priority }}
        </span>

        <!-- Dropdown toggle -->
        <button (click)="toggleSubtasks(task) ;$event.stopPropagation()" 
                class="p-1 rounded hover:bg-gray-600">
          <mat-icon class="text-gray-400 hover:text-white">
            {{ task.ShowSubtasks ? 'expand_less' : 'expand_more' }}
          </mat-icon>
        </button>

        <!-- 3-dot menu -->
        <div class="relative" (click)="$event.stopPropagation()">
          <button (click)="toggleTaskMenu(task)" class="p-1 rounded hover:bg-gray-600">
            <mat-icon class="text-gray-400 hover:text-white">more_vert</mat-icon>
          </button>
          <div *ngIf="task.showMenu"
               class="absolute right-0 mt-2 w-32 bg-gray-700 rounded-lg shadow-md text-sm z-20">
            <button (click)="editTask(task)" 
                    class="block w-full text-left px-4 py-2 hover:bg-gray-600 rounded-lg">Edit</button>
            <button (click)="deleteTask(task)" 
                    class="block w-full text-left px-4 py-2 text-red-400 hover:bg-gray-600 rounded-lg">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Progress -->
    <div class="mt-2 w-full bg-gray-700 h-2 rounded">
      <div class="h-2 rounded bg-green-500" [style.width.%]="getProgress(task)"></div>
    </div>

    <!-- Subtasks (Collapsible) -->
   <div *ngIf="task.ShowSubtasks" 
     @expandCollapse 
     class="mt-3 space-y-2 overflow-hidden">

  <div *ngFor="let sub of task.subtasks" 
       @subtaskAnimation 
       class="flex items-center bg-gray-900 p-2 rounded">
       
    <input type="checkbox" [(ngModel)]="sub.completed" class="mr-2" />
    <span [class.line-through]="sub.completed" class="text-sm">{{ sub.title }}</span>
  </div>
</div>
  </div>
</ng-container>

  </main>
</div>

<!-- ✅ Floating Add Button -->
<button class="fixed bottom-6 right-6 bg-green-600 p-4 rounded-full shadow-lg hover:bg-green-700 flex items-center justify-center"
  (click)="openAddTaskModal()">
  <mat-icon class="text-white">add</mat-icon>
</button>

<!-- ✅ Add Task Modal -->
<div *ngIf="" class="fixed inset-0 flex justify-center items-center z-50 bg-gray-10 bg-opacity-50 backdrop-blur-sm transition-opacity duration-300"
     [class.opacity-0]="!showAddTaskModal"
     [class.pointer-events-none]="!showAddTaskModal"
     (click)="closeAddTaskModal()">

  <!-- Modal -->
 <div class="bg-gray-900 p-6 rounded-xl w-96 relative transform transition-all duration-300"
       [class.scale-95]="!showAddTaskModal"
       [class.opacity-0]="!showAddTaskModal"
       [class.scale-100]="showAddTaskModal"
       [class.opacity-100]="showAddTaskModal"
       (click)="$event.stopPropagation()">

    <h2 class="text-xl font-bold mb-4 text-green-400">Add New Task</h2>

    <form (ngSubmit)="saveNewTask()" class="space-y-3">
      <input type="text" [(ngModel)]="newTask.title" name="title" placeholder="Title"
        class="w-full p-2 rounded bg-gray-800 text-white" />

      <textarea [(ngModel)]="newTask.description" name="description" placeholder="Description"
        class="w-full p-2 rounded bg-gray-800 text-white"></textarea>

      <label class="block text-sm">Due Date:</label>
      <input type="date" [(ngModel)]="newTask.dueDate" name="dueDate"
        class="w-full p-2 rounded bg-gray-800 text-white" />

      <label class="block text-sm">Priority:</label>
      <select [(ngModel)]="newTask.priority" name="priority"
        class="w-full p-2 rounded bg-gray-800 text-white">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <!-- Subtasks -->
      <div class="bg-gray-800 p-3 rounded">
        <h3 class="font-semibold text-sm mb-2">Subtasks</h3>
        <div *ngFor="let sub of newTask.subtasks; let i=index" class="flex items-center mb-2">
          <input type="text" [(ngModel)]="sub.title" name="subtask{{i}}"
                 class="flex-1 p-2 rounded bg-gray-900 text-white mr-2" />
          <button type="button" (click)="removeNewSubtask(i)" class="text-red-400">✖</button>
        </div>
        <button type="button" (click)="addNewSubtask()" class="text-green-400 text-sm">+ Add Subtask</button>
      </div>

      <div class="flex justify-end gap-2 mt-4">
        <button type="button" (click)="closeAddTaskModal()" class="px-4 py-2 bg-gray-700 rounded hover:bg-gray-600">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-green-600 rounded hover:bg-green-700">Save</button>
      </div>
    </form>

    <!-- Close button -->
    <button (click)="closeAddTaskModal()" class="absolute top-2 right-2 text-gray-400 hover:text-white">
      ✖
    </button>
  </div>
</div>
